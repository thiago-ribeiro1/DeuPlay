services:
  iptv-player:
    build: .
    image: iptv-player:local
    container_name: iptv-player
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - media-streams:/app/media
      # Descomente para hot reload em desenvolvimento (requer alterar o CMD
      # da imagem para "npm run dev" e montar node_modules como volume nomeado):
      # - ./server:/app/server
      # - ./public:/app/public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m
    pids_limit: 256
    restart: unless-stopped

volumes:
  media-streams:
